# Decap CMS configuration.
#
# Two backends below:
#  • local_backend — for `npm run cms` on your laptop. Edits hit the local
#    filesystem via decap-server. No auth, no internet needed. Decap honours
#    this only when `local_backend: true` AND the page is served from
#    localhost — so we can leave it on permanently. Production /admin
#    ignores it.
#  • github backend — used by the deployed /admin. Auth runs through the
#    Cloudflare Worker in cf-oauth-worker/.

local_backend: true

backend:
  name: github
  repo: andresnusep/nasha
  branch: main
  base_url: https://nasha-oauth.andresnusep.workers.dev
  auth_endpoint: auth

media_folder: public/uploads
public_folder: /uploads

site_url: https://nashabiggi.com
display_url: https://nashabiggi.com

collections:
  - name: site
    label: Site
    files:
      - name: site
        label: Site info (name, bio, links, portrait)
        file: content/site.json
        format: json
        fields:
          - { name: name, label: Artist name, widget: string }
          - { name: tagline, label: Tagline, widget: string }
          - { name: location, label: Location, widget: string }
          - { name: bio, label: Bio (long), widget: text }
          - name: links
            label: Links
            widget: object
            fields:
              - { name: instagram, label: Instagram handle, widget: string }
              - { name: soundcloud, label: SoundCloud path, widget: string }
              - { name: email, label: Booking email, widget: string }
          - { name: portrait, label: Portrait — About page (HI-RES), widget: image, required: false }
          - { name: portraitMin, label: Portrait — Home minimal (small card), widget: image, required: false }

      - name: tags
        label: Genre tags
        file: content/tags.json
        format: json
        fields:
          - name: tags
            label: Tags
            widget: list
            field: { name: tag, label: Tag, widget: string }

      - name: gallery
        label: Press photos / gallery
        file: content/gallery.json
        format: json
        fields:
          - name: items
            label: Photos
            widget: list
            fields:
              - { name: label, label: Caption, widget: string }
              - { name: tone, label: Background colour (hex), widget: string, default: '#c2ff00' }
              - { name: image, label: Photo, widget: image, required: false }

      - name: press
        label: Press kit (quotes / rider / specs)
        file: content/press.json
        format: json
        fields:
          - name: quotes
            label: Press quotes
            widget: list
            fields:
              - { name: text, label: Quote, widget: text }
              - { name: source, label: Source, widget: string }
              - { name: tone, label: Background colour (hex), widget: string, default: '#c2ff00' }
          - name: rider
            label: Technical rider
            widget: list
            fields:
              - { name: k, label: Label, widget: string }
              - { name: v, label: Value, widget: string }
          - name: specs
            label: Fact sheet
            widget: list
            fields:
              - { name: k, label: Label, widget: string }
              - { name: v, label: Value, widget: string }

  - name: mixes
    label: Mixes
    folder: content/mixes
    create: true
    format: json
    extension: json
    slug: '{{slug}}'
    summary: '{{title}} · {{bpm}} BPM · {{genre}}'
    sortable_fields: [order, date, title, bpm, plays]
    fields:
      - { name: id, label: ID (unique), widget: string, hint: 'e.g. m6' }
      - { name: order, label: Sort order, widget: number, value_type: int, default: 1 }
      - { name: title, label: Title, widget: string }
      - { name: genre, label: Genre, widget: string }
      - { name: bpm, label: BPM, widget: number, value_type: int }
      - { name: key, label: Key (camelot), widget: string }
      - { name: length, label: Length (mm:ss), widget: string }
      - { name: plays, label: Plays, widget: string }
      - { name: color, label: Accent colour (hex), widget: string, default: '#c2ff00' }
      - name: cues
        label: Cue points (0–1)
        widget: list
        field: { name: cue, label: Cue, widget: number, value_type: float, min: 0, max: 1, step: 0.01 }
      - { name: seed, label: Waveform seed (number), widget: number, value_type: int, default: 1 }
      - { name: date, label: Date, widget: date, format: 'YYYY-MM-DD' }
      - { name: venue, label: Recorded at, widget: string }
      - { name: blurb, label: Blurb, widget: text }
      - name: embedUrl
        label: Stream URL
        widget: string
        required: false
        hint: 'Where the mix lives — paste the SoundCloud / Mixcloud / YouTube / Spotify / Bandcamp URL. The mix detail modal will show a big "Play on [platform]" button that opens it in a new tab. Leave empty for no button.'
      - name: tracklist
        label: Tracklist
        widget: list
        field: { name: track, label: Track, widget: string }

  - name: gigs
    label: Gigs
    folder: content/gigs
    create: true
    format: json
    extension: json
    slug: '{{year}}-{{month}}-{{day}}-{{venue}}'
    summary: '{{date}} · {{venue}} · {{status}}'
    sortable_fields: [year, month, day, status, venue]
    fields:
      - { name: date, label: Date label (e.g. MAY 03), widget: string }
      - { name: day, label: Day (1–31), widget: number, value_type: int, min: 1, max: 31 }
      - name: month
        label: Month
        widget: select
        value_type: int
        options:
          - { label: January, value: 0 }
          - { label: February, value: 1 }
          - { label: March, value: 2 }
          - { label: April, value: 3 }
          - { label: May, value: 4 }
          - { label: June, value: 5 }
          - { label: July, value: 6 }
          - { label: August, value: 7 }
          - { label: September, value: 8 }
          - { label: October, value: 9 }
          - { label: November, value: 10 }
          - { label: December, value: 11 }
      - { name: year, label: Year, widget: number, value_type: int, default: 2026 }
      - name: dow
        label: Day of week
        widget: select
        options: [MON, TUE, WED, THU, FRI, SAT, SUN]
      - { name: venue, label: Venue, widget: string }
      - { name: city, label: City, widget: string }
      - name: status
        label: Status
        widget: select
        options: [UPCOMING, PLAYED]
        default: UPCOMING
      - { name: kind, label: Set type (e.g. Resident Night), widget: string }
      - { name: time, label: Time slot, widget: string }
      - { name: tickets, label: Tickets (only for upcoming), widget: string, required: false }

